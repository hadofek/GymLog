<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymLog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem 1rem;
      border-bottom: 1px solid #1f1f1f;
    }

    nav a {
      color: #f0f0f0;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      opacity: 0.75;
      transition: opacity 0.15s;
    }

    nav a:hover { opacity: 1; }
    nav a.active { opacity: 1; color: #f97316; font-weight: 600; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(249, 115, 22, 0.25);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    h1 span { color: #f97316; }

    .tagline {
      font-size: 1.05rem;
      color: #999;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .badge-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 0.55rem 1.1rem;
      font-size: 0.85rem;
      color: #ccc;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: #555;
      border-top: 1px solid #1f1f1f;
    }

    footer a { color: #777; text-decoration: none; }
    footer a:hover { color: #f97316; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>

  <main>
    <img src="icon.png" alt="GymLog app icon" class="logo" onerror="this.style.display='none'">
    <h1>Gym<span>Log</span></h1>
    <p class="tagline">Track your workouts, monitor progress, and build better habits — all stored privately on your device.</p>
    <div class="badge-row">
      <span class="badge">No account required</span>
      <span class="badge">Data stays on your device</span>
      <span class="badge">GPS cardio tracking</span>
    </div>
  </main>

  <footer>
    &copy; 2025 GymLog &nbsp;&middot;&nbsp;
    <a href="support.html">Support</a> &nbsp;&middot;&nbsp;
    <a href="privacy.html">Privacy Policy</a>
  </footer>

</body>
</html>
